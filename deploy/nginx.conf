# nginx in front of Kivora.
#
# Two settings matter more than the rest: the Upgrade/Connection pair, without
# which the WebSocket never establishes, and proxy_read_timeout, without which
# an idle chat window is disconnected every minute.

map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name chat.example.org;

	ssl_certificate     /etc/letsencrypt/live/chat.example.org/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/chat.example.org/privkey.pem;
	ssl_protocols       TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;

	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	server_tokens off;

	# Matches KIVORA_MAX_UPLOAD_MB.
	client_max_body_size 64m;

	location / {
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;

		proxy_set_header Upgrade    $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# Long-lived WebSocket connections.
		proxy_read_timeout  3600s;
		proxy_send_timeout  3600s;

		# Realtime events must not sit in a buffer.
		proxy_buffering off;
	}
}

server {
	listen 80;
	listen [::]:80;
	server_name chat.example.org;
	return 301 https://$host$request_uri;
}
